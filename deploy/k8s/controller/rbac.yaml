apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-controller
  namespace: default
  labels:
    app: controller
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-controller
  namespace: default
  labels:
    app: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-controller
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: canary-system
